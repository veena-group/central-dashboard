<div class="min-h-screen flex items-center justify-center bg-muted/40 px-4">
  <div class="w-full max-w-md card p-8">
    <div class="text-center mb-6">
      <svg class="w-8 h-8 text-primary mx-auto" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="-0.757324" y="19.2427" width="28" height="4" rx="2" transform="rotate(-45 -0.757324 19.2427)" fill="currentColor"/>
        <rect x="7.72803" y="27.728" width="28" height="4" rx="2" transform="rotate(-45 7.72803 27.728)" fill="currentColor"/>
        <rect x="10.5366" y="16.3945" width="16" height="4" rx="2" transform="rotate(45 10.5366 16.3945)" fill="currentColor"/>
        <rect x="10.5562" y="-0.556152" width="28" height="4" rx="2" transform="rotate(45 10.5562 -0.556152)" fill="currentColor"/>
      </svg>
      <h4 class="mt-3 text-lg font-semibold text-foreground">Welcome back</h4>
      <p class="text-sm text-muted-foreground">Sign in to your society dashboard</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-4">
        <label class="label required" for="email">Email</label>
        <input id="email" type="email" class="input" formControlName="email" placeholder="you@society.com" autocomplete="username">
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <small class="text-destructive text-xs">A valid email is required</small>
        }
      </div>

      <div class="mb-5">
        <label class="label required" for="password">Password</label>
        <div class="relative">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" class="input pr-10" formControlName="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="absolute right-0 top-0 h-10 w-10 flex items-center justify-center text-muted-foreground" (click)="togglePassword()">
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </div>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <small class="text-destructive text-xs">Password is required</small>
        }
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="submitting()">
        @if (submitting()) { Signing in... } @else { Sign in }
      </button>
    </form>
  </div>
</div>
