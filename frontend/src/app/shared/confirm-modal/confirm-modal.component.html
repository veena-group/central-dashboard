@if (open()) {
  <div class="confirm-modal-backdrop fixed inset-0 z-[70] bg-black/40 backdrop-blur-sm"></div>
  <div class="fixed inset-0 z-[80] flex items-center justify-center p-5 sm:p-6" (click)="cancelAction.emit()">
    <div class="confirm-modal-panel card w-full max-w-lg" (click)="$event.stopPropagation()">
      <div class="confirm-modal-close-row">
        <button type="button" class="btn btn-ghost btn-sm" (click)="cancelAction.emit()" aria-label="Close modal" title="Close">
          <span aria-hidden="true" class="text-lg leading-none">&times;</span>
        </button>
      </div>

      <div class="confirm-modal-content">
        <div class="confirm-modal-title-wrap">
          <div
            class="confirm-icon confirm-icon-xl confirm-icon-animated"
            [class.confirm-icon-danger]="iconTone() === 'danger'"
            [class.confirm-icon-warning]="iconTone() === 'warning'"
            [class.confirm-icon-info]="iconTone() === 'info'"
            aria-hidden="true">
            <lord-icon
              class="confirm-lord-icon"
              trigger="in"
              stroke="bold"
              [attr.src]="iconSrc()">
            </lord-icon>
          </div>
          <h4 class="confirm-modal-title">{{ title() }}</h4>
          <p class="confirm-modal-description">{{ resolvedDescription() }}</p>
        </div>
      </div>

      <div class="confirm-modal-actions">
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
          <button type="button" class="btn btn-soft-secondary min-w-28" (click)="cancelAction.emit()" [disabled]="confirming()" [title]="cancelLabel()">
            {{ cancelLabel() }}
          </button>
          <button type="button" class="btn btn-destructive min-w-28" (click)="confirmAction.emit()" [disabled]="confirming()" [title]="confirmLabel()">
            {{ confirming() ? 'Processing...' : confirmLabel() }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
